<!-- 🔥 PREMIUM UPGRADE (SAFE MERGE VERSION) -->
<style>

/* 🌌 Animated Background */
body{
background: linear-gradient(270deg,#0a0a1a,#1a1050,#0a0a1a);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* 💎 Glass Navbar */
nav{
backdrop-filter: blur(10px);
background: rgba(15,15,42,0.6);
}

/* ✨ Glow Logo */
.nav-logo{
text-shadow:0 0 15px rgba(159,91,255,0.6);
}

/* 🔍 Search Glow */
.nav-search input:focus{
border-color: var(--primary);
box-shadow:0 0 10px rgba(124,58,237,0.5);
}

/* 🎴 Book Card Premium */
.book-card{
transition: all .3s ease;
opacity:0;
transform: translateY(20px);
animation:fadeIn .6s ease forwards;
}

.book-card:hover{
transform: translateY(-8px) scale(1.03);
box-shadow:0 15px 40px rgba(124,58,237,0.5);
border-color:var(--primary);
}

/* 📚 Image Zoom */
.book-card:hover img{
transform:scale(1.05);
}

.book-cover-img{
transition:0.3s;
}

/* 🎬 Smooth Fade */
@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}

/* 🌟 Hero Glow */
.hero h1{
text-shadow:0 0 25px rgba(159,91,255,0.7);
}

/* 🔘 Button Glow */
.contact-form button:hover{
box-shadow:0 0 20px rgba(6,182,212,0.6);
}

/* 💫 Feature Cards Hover */
.feature-card{
transition:.3s;
}
.feature-card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(6,182,212,0.3);
}

/* 📢 Announcement Glow */
.announcement-bar{
animation: glowBar 2s infinite alternate;
}
@keyframes glowBar{
from{box-shadow:0 0 5px rgba(255,255,255,0.2);}
to{box-shadow:0 0 20px rgba(255,255,255,0.6);}
}

</style>

<script>

/* 🧠 Smart Tagline */
const tagline = document.querySelector(".kg-tagline");
if(tagline){
const h = new Date().getHours();
if(h<12) tagline.innerText="🌅 Subah ka best waqt — parhna shuru karein";
else if(h<18) tagline.innerText="📖 Aaj kuch naya seekhein";
else tagline.innerText="🌙 Raat ka sukoon — kitab ke saath";
}

/* 💡 Cursor Glow */
const cursor = document.createElement("div");
cursor.style.cssText = `
position:fixed;
width:20px;
height:20px;
border-radius:50%;
background:rgba(159,91,255,0.5);
pointer-events:none;
filter:blur(10px);
z-index:9999;
`;
document.body.appendChild(cursor);

document.addEventListener("mousemove", e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

</script>
